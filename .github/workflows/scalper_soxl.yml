name: "Ejecutar Scalper SOXL 30 Minutos"

on:
  schedule:
    # --- BRACKET 1: MORNING SESSIONS ---
    # 9:45 AM, 10:00 AM, 10:30 AM, 11:30 AM EST (Regular Market Hours)
    # Converted to UTC time: 13:45, 14:00, 14:30, 15:30 UTC
    - cron: '45 13 * * 1-5'
    - cron: '0 14 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '30 15 * * 1-5'
    
    # --- BRACKET 2: AFTERNOON SESSIONS ---
    # 2:00 PM, 2:30 PM, 3:00 PM, 3:30 PM EST (Pre-Close Squeeze)
    # Converted to UTC time: 18:00, 18:30, 19:00, 19:30 UTC
    - cron: '0 18 * * 1-5'
    - cron: '30 18 * * 1-5'
    - cron: '0 19 * * 1-5'
    - cron: '30 19 * * 1-5'
    
  workflow_dispatch: # Allows you to trigger manual checks at any minute

permissions:
  contents: write

jobs:
  scalper_run:
    name: Micro-Analisis de Minutos SOXL
    runs-on: ubuntu-latest
    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Librerias de Grado Institucional
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy xgboost requests

    - name: Ejecutar Motor Pro-Scalper
      run: python scalper_bot.py

    - name: Enviar Alerta Inmediata a Telegram
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message_file: telegram_scalper_msg.txt
