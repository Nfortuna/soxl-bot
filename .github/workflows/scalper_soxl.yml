name: "Ejecutar Scalper SOXL 30 Minutos"

on:
  schedule:
    # Se enciende automáticamente cada 30 minutos (en el minuto :00 y :30) 
    # de lunes a viernes entre las 13:00 UTC y las 20:00 UTC (Horario Bursátil NY)
    - cron: '0,30 13-20 * * 1-5'
    
  workflow_dispatch: # Permite probarlo manualmente cuando quieras

permissions:
  contents: write

jobs:
  scalper_run:
    name: Micro-Analisis de Minutos SOXL
    runs-on: ubuntu-latest
    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Librerias
      run: pip install yfinance pandas numpy xgboost requests

    - name: Ejecutar Motor Pro-Scalper
      run: python scalper_bot.py

    - name: Guardar Historial del Scalper en el Repositorio
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@://github.com'
        git add scalper_predictions.csv || true
        git commit -m "Auto-update: Caja Negra Scalper Intradía" || true
        git push || true

    - name: Enviar Alerta Inmediata a Telegram
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message_file: telegram_scalper_msg.txt
        # Añadimos parámetros de resistencia para evitar caídas por saturación de red
        debug: true
        format: markdown

