name: SOXL Scalper Bot Automático

on:
  schedule:
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch: 

jobs:
  run-scalper:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el Repositorio
      uses: actions/checkout@v4 

    - name: Configurar Entorno de Python
      uses: actions/setup-python@v5 
      with:
        python-version: '3.11' # Se eliminó la línea de caché para solucionar el error

    - name: Instalar Dependencias del Mercado
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas pytz requests

    - name: Ejecutar Lógica de Estimación Ponderada
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python scalper_bot.py
