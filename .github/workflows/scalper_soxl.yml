name: SOXL Scalper Bot Automático

on:
  schedule:
    # Corre de lunes a viernes cada 5 minutos entre las 13:00 y las 21:00 UTC
    # Esto cubre perfectamente el horario de mercado de Nueva York (9:30 AM - 4:00 PM EST)
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch: # Permite que puedas ejecutar el bot manualmente con un botón cuando quieras

jobs:
  run-scalper:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el Repositorio
      uses: actions/checkout@v4 # Forzado nativamente a Node 24 estable

    - name: Configurar Entorno de Python
      uses: actions/setup-python@v5 # Corre sobre entornos actualizados
      with:
        python-version: '3.11'
        cache: 'pip' # Acelera la descarga al guardar dependencias en caché

    - name: Instalar Dependencias del Mercado
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas pytz requests

    - name: Ejecutar Lógica de Estimación Ponderada
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python scalper_bot.py
