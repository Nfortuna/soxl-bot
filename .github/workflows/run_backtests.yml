name: "Correr Backtest Walk-Forward"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_evaluations:
    name: Validacion Cruzada Out-of-Sample
    runs-on: ubuntu-latest
    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Librerias Base
      run: pip install pandas numpy

    - name: Sanear Estructuras CSV Ocultas
      run: python limpiar_headers.py

    - name: Procesar Evaluacion Completa
      run: |
        python backtest_diario.py
        python backtest_scalper.py

    - name: Guardar Limpieza en GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@://github.com'
        git add soxl_predictions.csv scalper_predictions.csv || true
        git commit -m "Auto-cleanup: Saneamiento CSV" || true
        git push || true

    - name: Reportar Bot Diario a Telegram
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message_file: telegram_diario_audit.txt

    - name: Reportar Scalper a Telegram
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message_file: telegram_scalper_audit.txt
