name: SOXL Bot Principal Automático

on:
  schedule:
    # Corre de lunes a viernes cada 5 minutos en desfase (minutos 2, 7, 12, 17...)
    # Entre las 13:00 y las 21:00 UTC (Mercado NY)
    - cron: '2-57/5 13-21 * * 1-5'
  workflow_dispatch: # Permite ejecución manual con un botón

jobs:
  run-main-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el Repositorio
      uses: actions/checkout@v4

    - name: Configurar Entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar Dependencias del Mercado
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas pytz requests

    - name: Ejecutar Bot Principal Ponderado
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python script.py
